<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F4F1E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Schrein">
  <meta name="robots" content="noindex">
  <title>Schrein der Zahlen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Falls Safari die Seite als Desktop-Website darstellt (sehr kleine Schrift), passend vergrößern.
    (function () {
      function anpassen() {
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var quer = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
        var breite = quer ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        document.documentElement.style.zoom = '';
        var verhaeltnis = window.innerWidth / breite;
        if (touch && breite && verhaeltnis > 1.15) document.documentElement.style.zoom = verhaeltnis.toFixed(3);
      }
      anpassen();
      window.addEventListener('resize', anpassen);
      window.addEventListener('orientationchange', function () { setTimeout(anpassen, 300); });
    })();
  </script>
</head>
<body>
  <div id="app"><div class="screen"><p class="gedaempft">Wird geladen …</p></div></div>
  <div id="modal" class="modal"></div>
  <script type="module">
    import { starten } from './js/app.js';
    starten();
  </script>
</body>
</html>
