<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0e0f">
  <meta name="robots" content="noindex">
  <title>Jadeschlange · Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../kristallmine/km.css?v=2.4.5">
  <link rel="stylesheet" href="jsg.css?v=2.4.5">
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(ellipse at 50% 30%, #172022 0%, #0e1213 60%, #070909 100%); background-color: #0b0e0f; color: #E8F1EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
    .testseite { height: 100dvh; max-width: 520px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px); }
    .testseite > a { color: #5FE8B4; font-weight: 700; font-size: 17px; text-decoration: none; padding: 4px 0; }
  </style>
</head>
<body>
  <div class="testseite">
    <a href="../">← Zurück</a>
    <div id="spiel" style="flex:1 1 auto;min-height:0;display:flex"></div>
  </div>
  <script type="module">
    import { jadeschlangeStarten } from '../js/jadeschlange-ui.js?v=2.4.5';
    const KEY = 'jadeschlange-test';
    let stand = null;
    try { stand = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* egal */ }
    const spiel = jadeschlangeStarten(document.getElementById('spiel'), {
      stand,
      sichern: (st) => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* egal */ } },
      hinweisZusatz: 'Test 2.4.5'
    });
    window.addEventListener('pagehide', () => spiel.beenden());
    window.jsgSpiel = spiel;
  </script>
</body>
</html>
