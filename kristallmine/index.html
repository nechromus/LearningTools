<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0e0f">
  <meta name="robots" content="noindex">
  <title>Kristallmine · Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="km.css?v=2.3.0">
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(ellipse at 50% 30%, #172022 0%, #0e1213 60%, #070909 100%); background-color: #0b0e0f; color: #E8F1EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
    .testseite { height: calc(100dvh / var(--zoom, 1)); max-width: 520px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px); }
    .testseite > a { color: #5FE8B4; font-weight: 700; font-size: 17px; text-decoration: none; padding: 4px 0; }
  </style>
  <script>
    (function () {
      function anpassen() {
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var quer = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
        var breite = quer ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var html = document.documentElement;
        html.style.zoom = ''; html.style.removeProperty('--zoom');
        var v = window.innerWidth / breite;
        if (touch && breite && v > 1.15) { html.style.zoom = v.toFixed(3); html.style.setProperty('--zoom', v.toFixed(3)); }
      }
      anpassen();
      window.addEventListener('resize', anpassen);
    })();
  </script>
</head>
<body>
  <div class="testseite">
    <a href="../">← Zurück</a>
    <div id="spiel"></div>
  </div>
  <script type="module">
    import { kristallmineStarten } from '../js/kristallmine-ui.js?v=2.3.0';
    const KEY = 'kristallmine-test-v2';
    let stand = null;
    try { stand = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* egal */ }
    const spiel = kristallmineStarten(document.getElementById('spiel'), {
      stand,
      sichern: (st) => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* egal */ } },
      hinweisZusatz: 'Test 2.3.0'
    });
    window.addEventListener('pagehide', () => spiel.beenden());
    window.kristallmineStand = () => spiel.hoehle();
  </script>
</body>
</html>
